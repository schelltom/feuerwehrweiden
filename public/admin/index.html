<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Redaktion – Feuerwehr Weiden</title>
  </head>
  <body>
    <!-- Decap CMS: einfache Pflege-Oberfläche im Browser (Login via GitHub) -->
    <!-- Version FEST gepinnt (nicht ^3.0.0)! Sonst zieht unpkg automatisch die
         neueste 3.x – und ein kaputtes Release (z.B. 3.15.0 am 23.07.2026,
         React-Fehler #130) legt das komplette CMS lahm. Nur nach Test hochsetzen. -->
    <script src="https://unpkg.com/decap-cms@3.14.1/dist/decap-cms.js"></script>

    <!-- Editor-Vorschau der Berichte an die echte Website-Optik angleichen.
         vorschau.css spiegelt den Artikel-Abschnitt aus global.css; das
         Template baut dieselbe .artikel/.artikeltext-Struktur wie
         src/pages/berichte/[slug].astro nach. -->
    <script>
      (function () {
        var h = window.h;
        var createClass = window.createClass;
        if (!window.CMS || !h || !createClass) return;

        CMS.registerPreviewStyle('/admin/vorschau.css');

        var monate =['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
        function monatJahr(iso) {
          if (!iso) return '';
          var t = String(iso).slice(0, 10).split('-');
          if (t.length < 2) return '';
          var m = monate[parseInt(t[1], 10) - 1];
          return m ? m + ' ' + t[0] : '';
        }

        // Klickbare Slideshow wie auf der echten Berichtsseite (Pfeile + Punkte).
        var Slideshow = createClass({
          getInitialState: function () { return { i: 0 }; },
          geh: function (n) {
            var len = this.props.bilder.length;
            this.setState({ i: (n + len) % len });
          },
          render: function () {
            var self = this;
            var bilder = this.props.bilder;
            var i = Math.min(this.state.i, bilder.length - 1);
            var akt = bilder[i];

            var kinder = [
              h('div', { key: 'bild', className: 'vslide' }, akt.el),
              h('span', { key: 'stand', className: 'stand' }, (i + 1) + ' / ' + bilder.length),
            ];
            if (akt.text) kinder.push(h('figcaption', { key: 'cap' }, akt.text));
            if (bilder.length > 1) {
              kinder.push(h('button', { key: 'zur', type: 'button', className: 'spfeil zur', onClick: function () { self.geh(i - 1); } }, '←'));
              kinder.push(h('button', { key: 'wei', type: 'button', className: 'spfeil wei', onClick: function () { self.geh(i + 1); } }, '→'));
              kinder.push(
                h('div', { key: 'punkte', className: 'spunkte' },
                  bilder.map(function (_, j) {
                    return h('button', { key: j, type: 'button', className: j === i ? 'an' : '', onClick: function () { self.geh(j); } });
                  })
                )
              );
            }
            return h('div', { className: 'vslideshow' }, kinder);
          },
        });

        // Statische Reaktionsleiste (nur Optik – Zähler sind live 0).
        var REAKTIONEN = [['💪', 'Stark'], ['❤️', 'Danke'], ['🚒', 'Respekt']];

        var BerichtVorschau = createClass({
          render: function () {
            var entry = this.props.entry;
            var data = entry.get('data');

            var titel = data.get('titel');
            var kurz = data.get('kurz');
            var ressort = data.get('ressort');
            var titelbild = data.get('titelbild');
            var stats = data.get('stats');

            var kopf = [ressort, monatJahr(data.get('datum'))].filter(Boolean).join(' · ');

            var kinder = [];

            if (titelbild) {
              kinder.push(h('div', { key: 'bild', className: 'artikel-titelbild-wrap' }, this.props.widgetFor('titelbild')));
            }
            kinder.push(h('h1', { key: 'titel' }, titel || 'Ohne Titel'));
            if (kopf) kinder.push(h('p', { key: 'meta', className: 'artikel-meta' }, kopf));
            if (kurz) kinder.push(h('p', { key: 'lead', className: 'artikel-lead' }, kurz));

            if (stats && stats.size) {
              kinder.push(
                h('div', { key: 'stats', className: 'artikel-stats' },
                  stats.map(function (s, i) {
                    return h('div', { key: i, className: 'astat' }, [
                      h('b', { key: 'w' }, s.get('wert')),
                      h('span', { key: 'l' }, s.get('label')),
                    ]);
                  }).toArray()
                )
              );
            }

            kinder.push(h('div', { key: 'body', className: 'artikeltext' }, this.props.widgetFor('body')));

            // Bildergalerie als klickbare Slideshow – wie unter dem echten Bericht.
            // widgetsFor liefert je Galerie-Eintrag die REAKTIVE Bild-Vorschau
            // (zeigt frisch hochgeladene Bilder als Blob, vor dem Speichern).
            var galWidgets = this.props.widgetsFor('galerie');
            if (galWidgets && galWidgets.size) {
              var bilder = [];
              galWidgets.forEach(function (item) {
                if (item && item.getIn(['data', 'bild'])) {
                  bilder.push({ el: item.getIn(['widgets', 'bild']), text: item.getIn(['data', 'text']) });
                }
              });
              if (bilder.length) {
                kinder.push(
                  h('div', { key: 'galerie', className: 'artikel-galerie' }, [
                    h('span', { key: 'eb', className: 'eyebrow' }, 'Bilder'),
                    h(Slideshow, { key: 'ss', bilder: bilder }),
                  ])
                );
              }
            }

            // Reaktionsleiste (Optik wie live, Zähler statisch 0).
            kinder.push(
              h('div', { key: 'reakt', className: 'reaktionen' }, [
                h('span', { key: 't', className: 'reakt-titel' }, 'Deine Reaktion'),
                h('div', { key: 'c', className: 'reakt-chips' },
                  REAKTIONEN.map(function (r, ri) {
                    return h('div', { key: ri, className: 'reakt-chip' }, [
                      h('span', { key: 'e', className: 're-emoji' }, r[0]),
                      h('span', { key: 'w', className: 're-wort' }, r[1]),
                      h('b', { key: 'z', className: 're-zahl' }, '0'),
                    ]);
                  })
                ),
              ])
            );

            return h('div', { className: 'artikel' }, kinder);
          },
        });

        CMS.registerPreviewTemplate('berichte', BerichtVorschau);
      })();
    </script>
  </body>
</html>
