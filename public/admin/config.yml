# Decap CMS – Konfiguration der Redaktions-Oberfläche
#
# Voraussetzung fürs Live-System: Hosting bei Netlify mit aktiviertem
# "Identity" + "Git Gateway" (kostenlos). Bis dahin kann lokal mit
# `npx decap-server` + backend: name: proxy gearbeitet werden.

backend:
  name: git-gateway
  branch: main

# Für lokales Testen ohne Login (npx decap-server im Projektordner starten):
local_backend: true

media_folder: 'public/bilder/uploads'
public_folder: '/bilder/uploads'

locale: de

collections:
  - name: berichte
    label: Berichte & News
    label_singular: Bericht
    folder: src/content/berichte
    create: true
    slug: '{{slug}}'
    fields:
      - { name: titel, label: Titel, widget: string }
      - { name: datum, label: Datum, widget: datetime, format: 'YYYY-MM-DD', time_format: false }
      - name: ressort
        label: Ressort
        widget: select
        options: [Einsatzdienst, Feuerwehrverein, Fuhrpark, Verein, Jugend, Feuerwehr]
        default: Feuerwehr
      - { name: titelbild, label: Titelbild, widget: image, required: false }
      - { name: kurz, label: 'Kurzfassung (1 Satz)', widget: text, required: false }
      - name: stats
        label: 'Zahlen-Kacheln (optional)'
        widget: list
        required: false
        fields:
          - { name: wert, label: Wert, widget: string }
          - { name: label, label: Beschriftung, widget: string }
      - { name: body, label: Berichtstext, widget: markdown }

  - name: fahrzeuge
    label: Fahrzeuge
    label_singular: Fahrzeug
    folder: src/content/fahrzeuge
    create: true
    slug: '{{slug}}'
    fields:
      - { name: name, label: Name, widget: string, hint: 'z.B. HLF 20' }
      - { name: typ, label: Fahrzeugtyp, widget: string, hint: 'z.B. Hilfeleistungslöschgruppenfahrzeug' }
      - { name: funkruf, label: Funkrufname, widget: string, required: false, hint: 'z.B. FLORIAN WEIDEN 1/40/1 (Anhänger: leer lassen)' }
      - { name: standort, label: Standort, widget: string, default: Hauptfeuerwache, hint: 'Hauptfeuerwache oder z.B. FF Rothenstadt' }
      - name: kategorie
        label: Kategorie
        widget: select
        options:
          - { label: Fahrzeug, value: fahrzeug }
          - { label: Anhänger, value: anhaenger }
        default: fahrzeug
      - { name: inHalle, label: 'In der Fahrzeughalle auf der Startseite zeigen', widget: boolean, default: false }
      - { name: bild, label: Hauptbild, widget: image, required: false }
      - { name: reihenfolge, label: 'Reihenfolge (klein = weiter vorn)', widget: number, default: 99 }
      - name: specs
        label: Eckdaten
        widget: list
        required: false
        fields:
          - { name: label, label: Bezeichnung, widget: string }
          - { name: wert, label: Wert, widget: string }
      - { name: ausstattungTitel, label: 'Überschrift Ausstattung', widget: string, required: false }
      - name: ausstattung
        label: Ausstattung (Liste)
        widget: list
        required: false
        field: { name: eintrag, label: Eintrag, widget: string }
      - name: beladung
        label: Beladung nach Geräteräumen
        widget: list
        required: false
        fields:
          - { name: raum, label: Geräteraum, widget: string }
          - { name: bild, label: 'Foto des Geräteraums (erscheint im Aufklapp-Kasten)', widget: image, required: false }
          - name: inhalt
            label: Inhalt
            widget: list
            required: false
            field: { name: eintrag, label: Eintrag, widget: string }
      - name: galerie
        label: Bildergalerie
        widget: list
        required: false
        fields:
          - { name: bild, label: Bild, widget: image }
          - { name: text, label: Bildunterschrift, widget: string, required: false }
      - { name: body, label: Beschreibung, widget: markdown }

  - name: daten
    label: Einsätze & Termine
    files:
      - name: einsaetze
        label: Einsatzticker
        file: src/content/daten/einsaetze.json
        fields:
          - name: einsaetze
            label: Einsätze (neuester zuerst)
            widget: list
            fields:
              - { name: id, label: 'ID (z.B. 2026-07-06-2139)', widget: string }
              - { name: datum, label: 'Datum (TT.MM.JJJJ)', widget: string }
              - { name: zeit, label: 'Uhrzeit (HH:MM)', widget: string }
              - { name: stichwort, label: Einsatzstichwort, widget: string }
              - { name: art, label: Art, widget: select, options: [THL, Brand, Sonstige] }
      - name: termine
        label: Termine
        file: src/content/daten/termine.json
        fields:
          - name: termine
            label: Termine
            widget: list
            fields:
              - { name: id, label: ID, widget: string }
              - { name: datum, label: 'Datum (JJJJ-MM-TT)', widget: string }
              - { name: titel, label: Titel, widget: string }
              - { name: von, label: 'Beginn (HH:MM)', widget: string }
              - { name: bis, label: 'Ende (HH:MM)', widget: string }

  - name: pflegestelle
    label: Atemschutzpflegestelle
    files:
      - name: atemschutz
        label: Anlieferungen & Status
        file: src/content/daten/atemschutz.json
        fields:
          - name: vorgaenge
            label: Vorgänge
            label_singular: Vorgang
            widget: list
            summary: '{{fields.wehr}} – {{fields.artikel}} ({{fields.status}})'
            fields:
              - { name: id, label: 'ID (z.B. 2026-07-06-etzenricht)', widget: string }
              - { name: wehr, label: Wehr, widget: string }
              - { name: email, label: 'E-Mail der Wehr (für Benachrichtigung)', widget: string, required: false, default: '' }
              - { name: artikel, label: 'Was wurde angeliefert?', widget: string, hint: 'z.B. 2 Geräte, 4 Masken, Flaschen TÜV' }
              - name: status
                label: Status
                widget: select
                options:
                  - { label: 'Eingegangen', value: eingegangen }
                  - { label: 'In Pflege', value: in-pflege }
                  - { label: 'Abholbereit (löst E-Mail aus)', value: abholbereit }
                  - { label: 'Abgeholt (verschwindet von der Seite)', value: abgeholt }
                default: eingegangen
              - { name: eingegangen, label: 'Angeliefert am (JJJJ-MM-TT)', widget: string }
              - { name: hinweis, label: 'Hinweis (optional)', widget: string, required: false, default: '' }
              - { name: benachrichtigt, label: 'E-Mail wurde verschickt (setzt der Bot automatisch)', widget: boolean, default: false }

  - name: seiten
    label: 'Feuerwehr-Seiten (Über uns & Einheiten)'
    label_singular: Seite
    folder: src/content/seiten
    create: true
    slug: '{{slug}}'
    fields:
      - { name: titel, label: Titel, widget: string }
      - name: bereich
        label: Bereich
        widget: select
        options:
          - { label: 'Über uns', value: ueber-uns }
          - { label: Einheiten, value: einheiten }
          - { label: Ortsteile, value: ortsteile }
      - { name: reihenfolge, label: Reihenfolge, widget: number, default: 99 }
      - { name: kurz, label: 'Kurzzeile (für Übersichtskarte)', widget: string, required: false }
      - { name: titelbild, label: Titelbild, widget: image, required: false }
      - { name: wappen, label: 'Wappen (Ortsteile)', widget: image, required: false }
      - name: kontakt
        label: 'Kontaktkarte (für Personenseiten)'
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: name, label: Name, widget: string, required: false }
          - { name: telefon, label: Telefon, widget: string, required: false }
          - { name: fax, label: Telefax, widget: string, required: false }
          - { name: email, label: E-Mail, widget: string, required: false }
          - { name: adresse, label: Adresse, widget: string, required: false }
          - { name: bild, label: Porträt, widget: image, required: false }
      - name: gruppenfoto
        label: Gruppenfoto
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: bild, label: Bild, widget: image, required: false }
          - { name: text, label: 'Bildunterschrift (Namen)', widget: text, required: false }
      - name: personen
        label: Personen
        widget: list
        required: false
        fields:
          - { name: name, label: Name, widget: string }
          - { name: funktion, label: Funktion, widget: string, required: false }
          - name: sachgebiete
            label: Sachgebiete
            widget: list
            required: false
            field: { name: eintrag, label: Sachgebiet, widget: string }
          - { name: email, label: E-Mail, widget: string, required: false }
          - { name: bild, label: Foto, widget: image, required: false }
      - name: zeitstrahl
        label: 'Zeitstrahl (Chronik)'
        widget: list
        required: false
        fields:
          - { name: zeit, label: 'Jahr/Datum', widget: string }
          - { name: titel, label: Titel, widget: string }
          - { name: quelle, label: Quelle, widget: string, required: false }
          - { name: text, label: Text, widget: text, required: false }
      - name: galerie
        label: Bildergalerie
        widget: list
        required: false
        fields:
          - { name: bild, label: Bild, widget: image }
          - { name: text, label: Bildunterschrift, widget: string, required: false }
      - { name: body, label: Seitentext, widget: markdown, required: false }
