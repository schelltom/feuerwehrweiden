# Decap CMS – Konfiguration der Redaktions-Oberfläche
#
# Live-Login: GitHub-OAuth über den Cloudflare Worker (sveltia-cms-auth).
# Redakteure brauchen einen GitHub-Account mit Schreibrechten auf das Repo.
# Lokal ohne Login arbeiten: `npx decap-server` starten (local_backend).

backend:
  name: github
  repo: schelltom/feuerwehrweiden
  branch: main
  base_url: https://ffw-cms-auth.thomas-schell.workers.dev

# Für lokales Testen ohne Login (npx decap-server im Projektordner starten):
local_backend: true

# Medien-Wurzel = gesamter Bilder-Ordner, damit das CMS ALLE vorhandenen
# Bilder (auch header/, fahrzeuge/ …) als eigene Medien erkennt und in der
# Vorschau direkt aus dem Repo einbettet. Sonst greift der kaputte URL-Fallback
# (Unterpfad /feuerwehrweiden fehlt in den Vorschau-URLs → 404).
# Neue Uploads landen dadurch direkt in public/bilder/ (nicht mehr im Jahresordner).
media_folder: 'public/bilder'
public_folder: '/bilder'

locale: de

collections:
  - name: einsaetze
    label: Einsätze
    label_singular: Einsatz
    folder: src/content/einsaetze
    create: true
    identifier_field: stichwort
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{fields.wann}} – {{fields.art}} – {{fields.stichwort}}'
    sortable_fields: [wann]
    fields:
      - { name: wann, label: 'Datum & Uhrzeit', widget: datetime, format: 'YYYY-MM-DDTHH:mm', date_format: 'DD.MM.YYYY', time_format: 'HH:mm', hint: 'Ist mit jetzt vorbelegt' }
      - { name: art, label: Einsatzart, widget: select, options: [THL, Brand, Sonstige], default: THL }
      - name: stichwort
        label: Alarmstichwort
        widget: select
        default: 'THL 1'
        options:
          - B 1
          - B 2
          - B 2 PERSON
          - B 3
          - B 3 PERSON
          - B 4
          - THL 1
          - THL 2
          - THL 3
          - THL 4
          - THL 5
          - THL BELEUCHTUNG
          - THL BOMBENDROHUNG
          - THL BOMBENFUND
          - THL ERKUNDUNG
          - THL FIRST RESPONDER
          - THL GEBÄUDEEINSTURZ
          - THL GROßTIERRETTUNG
          - THL HUBSCHRAUBERLANDUNG
          - THL P AUFZUG
          - THL P EINGESCHLOSSEN
          - THL P RETTUNG H / T
          - THL P STRAßENBAHN
          - THL P STROM
          - THL P U-BAHN
          - THL P VERSCHÜTTET
          - THL P ZUG
          - THL RETTUNGSKORB
          - THL SCHIENE
          - THL TRAGEHILFE
          - THL UNWETTER
          - THL WASSER
          - ABC 1
          - ABC 2
          - ABC 3
          - ABC B
          - ABC B ATOM
          - ABC B BIO / CHEMIE
          - ABC EXPLOSION
          - ABC GEFAHRSTOFFMELDEANLAGE
          - ABC KRAFTSTOFF
          - ABC ÖL LAND
          - ABC ÖL WASSER
          - ABC THL ATOM
          - ABC THL BIO / CHEMIE
          - Sonstiges
      - { name: details, label: 'Zusatz (optional)', widget: string, required: false, default: '', hint: 'z.B. "Straße reinigen klein" – erscheint als "THL 1 – Straße reinigen klein"' }

  - name: berichte
    label: Berichte & News
    label_singular: Bericht
    folder: src/content/berichte
    create: true
    slug: '{{slug}}'
    # Eigener Bilder-Ordner je Bericht, aufgeteilt nach Jahr (aus dem Datum-Feld).
    # Wichtig für Redakteure: erst das Datum setzen, dann Bilder hochladen –
    # sonst fehlt das Jahr und der Upload landet im allgemeinen public/bilder.
    media_folder: '/public/bilder/berichte/{{fields.datum | date("YYYY")}}'
    public_folder: '/bilder/berichte/{{fields.datum | date("YYYY")}}'
    fields:
      - { name: titel, label: Titel, widget: string }
      - { name: datum, label: Datum, widget: datetime, format: 'YYYY-MM-DD', time_format: false }
      - name: ressort
        label: Ressort
        widget: select
        options: [Einsatzdienst, Übungsdienst, Feuerwehrverein, Fuhrpark, Verein, Jugend, Feuerwehr]
        default: Feuerwehr
      - { name: titelbild, label: Titelbild, widget: image, required: false }
      - { name: kurz, label: 'Kurzfassung (1 Satz)', widget: text, required: false }
      - name: stats
        label: 'Zahlen-Kacheln (optional)'
        widget: list
        required: false
        collapsed: true
        minimize_collapsed: true
        summary: '{{fields.wert}} {{fields.label}}'
        fields:
          - { name: wert, label: Wert, widget: string }
          - { name: label, label: Beschriftung, widget: string }
      - name: galerie
        label: 'Bildergalerie (Slideshow unter dem Bericht)'
        label_singular: Bild
        widget: list
        required: false
        collapsed: true
        minimize_collapsed: true
        summary: '{{fields.text}}'
        hint: 'Beliebig viele Bilder hochladen – sie erscheinen als durchklickbare Slideshow unter dem Berichtstext.'
        fields:
          - { name: bild, label: Bild, widget: image }
          - { name: text, label: 'Bildunterschrift (optional)', widget: string, required: false }
      - { name: body, label: Berichtstext, widget: markdown }

  - name: fahrzeuge
    label: Fahrzeuge
    label_singular: Fahrzeug
    folder: src/content/fahrzeuge
    create: true
    slug: '{{slug}}'
    # Fahrzeug-Bilder gemeinsam in einem Ordner (kein Jahr)
    media_folder: '/public/bilder/fahrzeuge'
    public_folder: '/bilder/fahrzeuge'
    identifier_field: name
    summary: '{{fields.name}} – {{fields.typ}}'
    sortable_fields: [name, reihenfolge, standort]
    view_filters:
      - { label: Fahrzeuge, field: kategorie, pattern: fahrzeug }
      - { label: Anhänger, field: kategorie, pattern: anhaenger }
    fields:
      - { name: name, label: Name, widget: string, hint: 'z.B. HLF 20' }
      - { name: typ, label: Fahrzeugtyp, widget: string, hint: 'z.B. Hilfeleistungslöschgruppenfahrzeug' }
      - { name: funkruf, label: Funkrufname, widget: string, required: false, hint: 'z.B. FLORIAN WEIDEN 1/40/1 (Anhänger: leer lassen)' }
      - { name: standort, label: Standort, widget: string, default: Hauptfeuerwache, hint: 'Hauptfeuerwache oder z.B. FF Rothenstadt' }
      - name: kategorie
        label: Kategorie
        widget: select
        options:
          - { label: Fahrzeug, value: fahrzeug }
          - { label: Anhänger, value: anhaenger }
        default: fahrzeug
      - name: gruppe
        label: 'Gruppe (Fuhrpark-Übersicht)'
        widget: select
        options:
          - { label: 'Einsatzleitwagen / Kommandowagen', value: elw-kdow }
          - { label: 'Lösch- und Tanklöschfahrzeuge', value: loesch }
          - { label: 'Hubrettungsfahrzeuge', value: hubrettung }
          - { label: 'Rüst- und Gerätewagen', value: ruest-geraete }
          - { label: 'Sonstige Fahrzeuge', value: sonstige }
          - { label: 'Anhänger', value: anhaenger }
          - { label: 'Rollcontainer', value: rollcontainer }
          - { label: 'Ehemalige Fahrzeuge', value: ehemalige }
        default: sonstige
      - { name: inHalle, label: 'In der Fahrzeughalle auf der Startseite zeigen', widget: boolean, default: false }
      - { name: bild, label: Hauptbild, widget: image, required: false }
      - { name: reihenfolge, label: 'Reihenfolge (klein = weiter vorn)', widget: number, default: 99 }
      - name: specs
        label: 'Eckdaten (kleine Steckbrief-Tabelle auf der Fahrzeugseite)'
        label_singular: Eckdatum
        widget: list
        required: false
        collapsed: true
        minimize_collapsed: true
        summary: '{{fields.label}}: {{fields.wert}}'
        hint: 'Eine Zeile je Angabe – z.B. Bezeichnung "Baujahr", Wert "2023" oder "Besatzung" / "1/8".'
        fields:
          - { name: label, label: Bezeichnung, widget: string }
          - { name: wert, label: Wert, widget: string }
      - { name: ausstattungTitel, label: 'Überschrift über der Ausstattungs-Liste (optional)', widget: string, required: false, hint: 'z.B. "Besondere Ausstattung" – leer lassen für Standard' }
      - name: ausstattung
        label: 'Ausstattung (einfache Aufzählung)'
        label_singular: Eintrag
        widget: list
        required: false
        collapsed: true
        minimize_collapsed: true
        hint: 'Ein Eintrag pro Zeile, z.B. "Seilwinde 5 t" – erscheint als Aufzählung auf der Fahrzeugseite.'
        field: { name: eintrag, label: Eintrag, widget: string }
      - name: beladung
        label: 'Beladung – ein Eintrag je Geräteraum'
        label_singular: Geräteraum
        widget: list
        required: false
        collapsed: true
        minimize_collapsed: true
        summary: '{{fields.raum}}'
        hint: 'Je Geräteraum (G1, G2, Dach …) ein Foto und die Liste der Ausrüstung. Erscheint als Aufklapp-Kasten auf der Fahrzeugseite.'
        fields:
          - { name: raum, label: 'Geräteraum (z.B. G1 – links vorne)', widget: string }
          - { name: bild, label: 'Foto des Geräteraums (optional)', widget: image, required: false }
          - name: inhalt
            label: 'Ausrüstung in diesem Raum'
            label_singular: Gegenstand
            widget: list
            required: false
            collapsed: true
            hint: 'Ein Eintrag pro Gegenstand, z.B. "Hydraulikaggregat".'
            field: { name: eintrag, label: Gegenstand, widget: string }
      - name: galerie
        label: Bildergalerie
        label_singular: Bild
        widget: list
        required: false
        collapsed: true
        minimize_collapsed: true
        summary: '{{fields.text}}'
        fields:
          - { name: bild, label: Bild, widget: image }
          - { name: text, label: Bildunterschrift, widget: string, required: false }
      - { name: body, label: Beschreibung, widget: markdown }

  - name: termine
    label: Termine
    label_singular: Termin
    folder: src/content/termine
    create: true
    identifier_field: titel
    slug: '{{fields.datum}}-{{slug}}'
    summary: '{{fields.datum}} – {{fields.titel}} ({{fields.kategorie}})'
    sortable_fields: [datum, titel, kategorie]
    fields:
      - { name: titel, label: Name des Termins, widget: string, hint: 'z.B. Terrassenfest' }
      - { name: datum, label: Datum, widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD.MM.YYYY', time_format: false }
      - { name: von, label: 'Beginn (HH:MM)', widget: string, default: '19:00', pattern: ['^([01][0-9]|2[0-3]):[0-5][0-9]$', 'Uhrzeit im Format HH:MM, z.B. 19:00'] }
      - { name: bis, label: 'Ende (HH:MM)', widget: string, default: '21:00', pattern: ['^([01][0-9]|2[0-3]):[0-5][0-9]$', 'Uhrzeit im Format HH:MM, z.B. 21:00'] }
      - name: kategorie
        label: Kategorie
        widget: relation
        collection: terminkategorien
        search_fields: [name]
        display_fields: [name]
        value_field: name
        hint: 'Neue Kategorie? Erst unter "Terminkategorien" anlegen.'

  - name: terminkategorien
    label: Terminkategorien
    label_singular: Kategorie
    folder: src/content/terminkategorien
    create: true
    identifier_field: name
    slug: '{{slug}}'
    summary: '{{fields.name}}'
    fields:
      - { name: name, label: Name, widget: string, hint: 'z.B. Jugend, UG-ÖEL, 1. Zug' }
      - { name: farbe, label: 'Farbe (im Kalender)', widget: color, allowInput: true, default: '#5B6170' }

  - name: pflege
    label: Atemschutzwerkstatt & Schlauchpflegestelle
    label_singular: Anlieferung
    folder: src/content/pflege
    create: true
    identifier_field: wehr
    slug: '{{year}}-{{month}}-{{day}}-{{fields.wehr}}'
    summary: '{{fields.wehr}} – abgegeben {{fields.abgegeben}}'
    fields:
      - name: wehr
        label: Feuerwehr
        widget: relation
        collection: wehren
        search_fields: [name]
        display_fields: [name]
        value_field: '{{slug}}'
        hint: 'Wehr nicht in der Liste? Erst unter "Feuerwehren" anlegen – die E-Mail wird dort gepflegt.'
      - { name: abgegeben, label: 'Abgegeben am', widget: datetime, format: 'YYYY-MM-DDTHH:mm', date_format: 'DD.MM.YYYY', time_format: 'HH:mm', hint: 'Ist mit jetzt vorbelegt' }
      - { name: geraete, label: 'Anzahl Atemschutzgeräte', widget: number, value_type: int, min: 0, default: 0 }
      - { name: masken, label: 'Anzahl Masken', widget: number, value_type: int, min: 0, default: 0 }
      - { name: flaschen, label: 'Anzahl Flaschen', widget: number, value_type: int, min: 0, default: 0 }
      - { name: schlaeucheB, label: 'Anzahl B-Schläuche', widget: number, value_type: int, min: 0, default: 0 }
      - { name: schlaeucheC, label: 'Anzahl C-Schläuche', widget: number, value_type: int, min: 0, default: 0 }
      - { name: hinweis, label: 'Hinweis (optional)', widget: string, required: false, default: '' }
      - { name: abholbereit, label: 'Geprüft & abholbereit (löst die E-Mail an die Wehr aus)', widget: boolean, default: false }
      - { name: abgeholt, label: 'Abgeholt (verschwindet von der Website)', widget: boolean, default: false }
      - { name: abholbereitSeit, widget: hidden, default: '' }
      - { name: benachrichtigt, widget: hidden, default: false }

  - name: wehren
    label: Feuerwehren (Atemschutzwerkstatt & Schlauchpflegestelle)
    label_singular: Feuerwehr
    folder: src/content/wehren
    create: true
    identifier_field: name
    slug: '{{slug}}'
    summary: '{{fields.name}} ({{fields.email}})'
    fields:
      - { name: name, label: Name, widget: string, hint: 'z.B. FF Etzenricht' }
      - { name: email, label: 'E-Mail (für die Abholbereit-Benachrichtigung)', widget: string, required: false, default: '' }

  - name: seiten
    label: 'Feuerwehr-Seiten (Über uns & Einheiten)'
    label_singular: Seite
    folder: src/content/seiten
    create: true
    slug: '{{slug}}'
    # Bilder je Bereich getrennt (ueber-uns / einheiten / ortsteile –
    # aus dem Feld "bereich"). Erst Bereich wählen, dann Bilder hochladen.
    media_folder: '/public/bilder/{{fields.bereich}}'
    public_folder: '/bilder/{{fields.bereich}}'
    fields:
      - { name: titel, label: Titel, widget: string }
      - name: bereich
        label: Bereich
        widget: select
        options:
          - { label: 'Über uns', value: ueber-uns }
          - { label: Einheiten, value: einheiten }
          - { label: Ortsteile, value: ortsteile }
      - { name: reihenfolge, label: Reihenfolge, widget: number, default: 99 }
      - { name: kurz, label: 'Kurzzeile (für Übersichtskarte)', widget: string, required: false }
      - { name: titelbild, label: Titelbild, widget: image, required: false }
      - { name: kartenbild, label: 'Bild für die Übersichtskarte (falls anders als Titelbild)', widget: image, required: false }
      - { name: wappen, label: 'Wappen (Ortsteile)', widget: image, required: false }
      - { name: extern, label: 'Externe Website (Karte verlinkt dorthin)', widget: string, required: false }
      - name: kartenmotiv
        label: 'Kartenmotiv statt Foto (optional)'
        widget: select
        required: false
        options:
          - { label: Gerätehaus-Silhouette, value: geraetehaus }
      - name: kontakt
        label: 'Kontaktkarte (für Personenseiten)'
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: name, label: Name, widget: string, required: false }
          - { name: telefon, label: Telefon, widget: string, required: false }
          - { name: fax, label: Telefax, widget: string, required: false }
          - { name: email, label: E-Mail, widget: string, required: false }
          - { name: adresse, label: Adresse, widget: string, required: false }
          - { name: bild, label: Porträt, widget: image, required: false }
      - name: gruppenfoto
        label: Gruppenfoto
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: bild, label: Bild, widget: image, required: false }
          - { name: text, label: 'Bildunterschrift (Namen)', widget: text, required: false }
      - name: personen
        label: Personen
        widget: list
        required: false
        fields:
          - { name: name, label: Name, widget: string }
          - { name: funktion, label: Funktion, widget: string, required: false }
          - name: sachgebiete
            label: Sachgebiete
            widget: list
            required: false
            field: { name: eintrag, label: Sachgebiet, widget: string }
          - { name: telefon, label: Telefon, widget: string, required: false }
          - { name: email, label: E-Mail, widget: string, required: false }
          - { name: bild, label: Foto, widget: image, required: false }
      - name: zeitstrahl
        label: 'Zeitstrahl (Chronik)'
        widget: list
        required: false
        fields:
          - { name: zeit, label: 'Jahr/Datum', widget: string }
          - { name: titel, label: Titel, widget: string }
          - { name: quelle, label: Quelle, widget: string, required: false }
          - { name: text, label: Text, widget: text, required: false }
          - { name: bild, label: Bild, widget: image, required: false }
          - { name: bildtext, label: Bildunterschrift, widget: string, required: false }
      - name: uebungsplan
        label: 'Übungsplan (Jugendfeuerwehr)'
        widget: list
        required: false
        fields:
          - { name: tag, label: Wochentag, widget: string, required: false }
          - { name: datum, label: Datum, widget: string }
          - { name: zeit, label: Uhrzeit, widget: string, required: false }
          - { name: thema, label: Thema, widget: string }
      - name: galerie
        label: Bildergalerie
        widget: list
        required: false
        fields:
          - { name: bild, label: Bild, widget: image }
          - { name: text, label: Bildunterschrift, widget: string, required: false }
      - { name: body, label: Seitentext, widget: markdown, required: false }
