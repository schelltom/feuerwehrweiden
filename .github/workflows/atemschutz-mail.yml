# Verschickt automatisch eine E-Mail an die betroffene Wehr, sobald die
# Pflegestelle einen Vorgang auf "abholbereit" stellt (im CMS oder per Datei).
#
# Einrichtung (einmalig, sobald das Repo auf GitHub liegt):
#   1. Kostenloses Konto bei https://resend.com anlegen, Domain verifizieren
#   2. Im GitHub-Repo unter Settings → Secrets → Actions anlegen:
#        RESEND_API_KEY  = API-Schlüssel von Resend
#        MAIL_VON        = Atemschutzpflegestelle <pflegestelle@feuerwehr-weiden.de>

name: Atemschutz-Benachrichtigung

on:
  push:
    branches: [main]
    paths:
      - 'src/content/daten/atemschutz.json'

permissions:
  contents: write

jobs:
  benachrichtigen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: E-Mails verschicken
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_VON: ${{ secrets.MAIL_VON }}
        run: node scripts/atemschutz-benachrichtigen.mjs

      - name: Benachrichtigt-Flags committen
        run: |
          if ! git diff --quiet; then
            git config user.name "Atemschutz-Bot"
            git config user.email "actions@github.com"
            git add src/content/daten/atemschutz.json
            git commit -m "Atemschutz: Benachrichtigungen verschickt"
            git push
          fi
