name: Atemschutzwerkstatt & Schlauchpflegestelle – Abholbereit-Benachrichtigung

on:
  push:
    branches: [main]
    paths:
      - 'src/content/pflege/**'
      - 'src/content/schlaeuche/**'
      - 'src/content/wehren/**'

permissions:
  contents: write

# Mehrere Einträge kurz hintereinander (z. B. über das CMS) nacheinander abarbeiten,
# nicht parallel – sonst überholt sich der Bot beim Pushen selbst.
concurrency:
  group: pflege-mail
  cancel-in-progress: false

jobs:
  benachrichtigen:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mail-Bibliothek installieren
        run: npm install --no-save nodemailer
      - name: Abholbereite Vorgänge stempeln & E-Mail verschicken
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: node scripts/pflege-mail.mjs
      - name: Änderungen committen (Stempel & abgeholte Vorgänge entfernt)
        run: |
          git config user.name "pflege-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A src/content/pflege src/content/schlaeuche
          if ! git diff --cached --quiet; then
            git commit -m "Atemschutzwerkstatt & Schlauchpflegestelle: abholbereit vermerkt / E-Mail verschickt / abgeholt entfernt"
            # Zwischenzeitlich eingegangene Commits (z. B. neue Anlieferung) einholen und erneut pushen
            for versuch in 1 2 3 4; do
              git pull --rebase origin main && git push && break
              sleep $((versuch * 3))
              if [ "$versuch" = 4 ]; then exit 1; fi
            done
          fi
