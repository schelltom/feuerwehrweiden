name: Pflegestelle – Abholbereit-Benachrichtigung

on:
  push:
    branches: [main]
    paths:
      - 'src/content/pflege/**'
      - 'src/content/wehren/**'

permissions:
  contents: write

jobs:
  benachrichtigen:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mail-Bibliothek installieren
        run: npm install --no-save nodemailer
      - name: Abholbereite Vorgänge stempeln & E-Mail verschicken
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: node scripts/pflege-mail.mjs
      - name: Zeitstempel committen
        run: |
          git config user.name "pflege-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/pflege
          if ! git diff --cached --quiet; then
            git commit -m "Pflegestelle: abholbereit vermerkt / E-Mail verschickt"
            git push
          fi
