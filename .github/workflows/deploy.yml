name: Deploy zu GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur EIN Deploy gleichzeitig. Ohne das überholen sich bei einem Schwall
# schneller CMS-Pushes mehrere parallele Builds und ein veralteter kann den
# neuen überschreiben (z.B. eine schon abgeholte Anlieferung bleibt im
# Frontend hängen). Der laufende Build wird bewusst NICHT abgebrochen; nur
# der jeweils neueste wartende Build kommt danach dran -> zuletzt gewinnt
# immer der aktuellste Stand.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: GitHub Pages aktivieren
        uses: actions/configure-pages@v4
        with:
          enablement: true
      - name: Website bauen
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
