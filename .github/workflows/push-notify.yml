name: Push-Benachrichtigung bei neuem Bericht/Einsatz

on:
  push:
    branches: [main]
    paths:
      - 'src/content/berichte/**'
      - 'src/content/einsaetze/**'
  workflow_dispatch:
    inputs:
      dateien:
        description: 'Manuell nachpushen: Pfad(e) zu .md-Dateien, Leerzeichen-getrennt (z. B. src/content/einsaetze/2026-09-03-thl-1.md)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  benachrichtigen:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Neu hinzugekommene Beiträge ermitteln
        id: neu
        env:
          MANUELL: ${{ inputs.dateien }}
        run: |
          # Manuell ausgelöst: die übergebenen Pfade direkt verwenden (das
          # Push-Skript entscheidet weiter unten selbst, ob wirklich gepusht wird).
          if [ -n "$MANUELL" ]; then
            FILES=$(printf '%s\n' $MANUELL | grep -E '^src/content/(berichte|einsaetze)/.*\.md$' || true)
            {
              echo 'files<<EOF'
              echo "$FILES"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            echo "Manuell angefordert:"; echo "$FILES"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          # Hinzugekommene UND geänderte Dateien betrachten – das Skript
          # entscheidet anhand des Vorher-Stands, ob wirklich gepusht wird
          # (nur beim Übergang Entwurf/neu → veröffentlicht).
          # core.quotePath=false: sonst umschließt Git Pfade mit Umlauten
          # mit Anführungszeichen + Oktal-Escapes ("…n\303\244chtlicher…"),
          # wodurch der ^src-verankerte Filter unten nicht mehr greift.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            LIST=$(git -c core.quotePath=false diff-tree --no-commit-id --diff-filter=AM --name-only -r "$SHA")
          else
            LIST=$(git -c core.quotePath=false diff --diff-filter=AM --name-only "$BEFORE" "$SHA")
          fi
          FILES=$(echo "$LIST" | grep -E '^src/content/(berichte|einsaetze)/.*\.md$' || true)
          # mehrzeilig für die nächsten Steps bereitstellen
          {
            echo 'files<<EOF'
            echo "$FILES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Geänderte Beitrags-Dateien:"; echo "$FILES"

      - name: Node einrichten
        if: steps.neu.outputs.files != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Push-Bibliotheken installieren
        if: steps.neu.outputs.files != ''
        run: npm install --no-save web-push gray-matter

      - name: Benachrichtigungen verschicken
        if: steps.neu.outputs.files != ''
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
          LIST_TOKEN: ${{ secrets.PUSH_LIST_TOKEN }}
          GIT_BEFORE: ${{ github.event.before }}
        run: |
          echo "${{ steps.neu.outputs.files }}" | tr '\n' '\0' | xargs -0 node scripts/push-notify.mjs
