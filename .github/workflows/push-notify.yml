name: Push-Benachrichtigung bei neuem Bericht/Einsatz

# Läuft erst NACH einem erfolgreichen Deploy, damit der Link in der Push-
# Nachricht beim Antippen schon funktioniert (vorher kam der Push oft vor der
# fertigen Seite an -> 404).
on:
  workflow_run:
    workflows: ['Deploy zu GitHub Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dateien:
        description: 'Manuell nachpushen: Pfad(e) zu .md-Dateien, Leerzeichen-getrennt (z. B. src/content/einsaetze/2026-09-03-thl-1.md)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  benachrichtigen:
    # Nur nach erfolgreichem Deploy (oder manuell)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Neu hinzugekommene Beiträge ermitteln
        id: neu
        env:
          MANUELL: ${{ inputs.dateien }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Manuell ausgelöst: die übergebenen Pfade direkt verwenden (das
          # Push-Skript entscheidet weiter unten selbst, ob wirklich gepusht wird).
          if [ -n "$MANUELL" ]; then
            FILES=$(printf '%s\n' $MANUELL | grep -E '^src/content/(berichte|einsaetze)/.*\.md$' || true)
            {
              echo 'files<<EOF'
              echo "$FILES"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            echo "Manuell angefordert:"; echo "$FILES"
            exit 0
          fi
          SHA="${{ github.event.workflow_run.head_sha }}"
          # Basis = Stand des letzten ERFOLGREICHEN Deploys davor (nicht nur der
          # Vor-Commit): wird ein Deploy bei schnellen Pushes abgebrochen
          # (cancel-in-progress), geht dessen Beitrag sonst nie raus. Das Push-
          # Skript pusht nur beim Übergang neu/Entwurf -> veröffentlicht, und der
          # Worker-Dedup verhindert Doppelte.
          BEFORE=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=10" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.event.workflow_run.id }})][0].head_sha' || true)
          [ "$BEFORE" = "null" ] && BEFORE=""
          [ -z "$BEFORE" ] && BEFORE=$(git rev-parse "${SHA}^" 2>/dev/null || echo 0000000000000000000000000000000000000000)
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          # Hinzugekommene UND geänderte Dateien betrachten – das Skript
          # entscheidet anhand des Vorher-Stands, ob wirklich gepusht wird
          # (nur beim Übergang Entwurf/neu → veröffentlicht).
          # core.quotePath=false: sonst umschließt Git Pfade mit Umlauten
          # mit Anführungszeichen + Oktal-Escapes ("…n\303\244chtlicher…"),
          # wodurch der ^src-verankerte Filter unten nicht mehr greift.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            LIST=$(git -c core.quotePath=false diff-tree --no-commit-id --diff-filter=AM --name-only -r "$SHA")
          else
            LIST=$(git -c core.quotePath=false diff --diff-filter=AM --name-only "$BEFORE" "$SHA")
          fi
          FILES=$(echo "$LIST" | grep -E '^src/content/(berichte|einsaetze)/.*\.md$' || true)
          # mehrzeilig für die nächsten Steps bereitstellen
          {
            echo 'files<<EOF'
            echo "$FILES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Geänderte Beitrags-Dateien:"; echo "$FILES"

      - name: Warten, bis die Seite live ist
        if: steps.neu.outputs.files != '' && github.event_name == 'workflow_run'
        run: |
          # Pages liefert nach dem Deploy teils noch kurz die alte Version aus.
          # Bis zu 5 Min warten, bis die neuen Berichtsseiten antworten (nicht fatal).
          echo "${{ steps.neu.outputs.files }}" | grep '/berichte/' | while read -r f; do
            slug=$(basename "$f" .md)
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://feuerwehr-weiden.de/berichte/${slug}/" || true)
              [ "$code" = "200" ] && { echo "live: $slug"; break; }
              echo "warte ($code): $slug"; sleep 10
            done
          done
          true

      - name: Node einrichten
        if: steps.neu.outputs.files != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Push-Bibliotheken installieren
        if: steps.neu.outputs.files != ''
        run: npm install --no-save web-push gray-matter

      - name: Benachrichtigungen verschicken
        if: steps.neu.outputs.files != ''
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
          LIST_TOKEN: ${{ secrets.PUSH_LIST_TOKEN }}
          GIT_BEFORE: ${{ steps.neu.outputs.before }}
        run: |
          echo "${{ steps.neu.outputs.files }}" | tr '\n' '\0' | xargs -0 node scripts/push-notify.mjs
